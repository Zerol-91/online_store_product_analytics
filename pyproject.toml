[project]
name = "online-store-product-analytics"
version = "0.1.0"
description = "Purchase funnel and repeat-purchase analysis of cosmetics store events."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3,<4",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "playwright>=1.58,<2",
]
